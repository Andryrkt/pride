# Environnement de développement PRIDe
#   docker compose up -d            -> base de données, stockage de fichiers, boîte mail de test
#   docker compose --profile app up -d --build   -> + l'application web en conteneur
name: pride

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pride
      POSTGRES_PASSWORD: pride
      POSTGRES_DB: pride
    ports: ["5432:5432"]
    volumes: [db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pride -d pride"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: pride
      MINIO_ROOT_PASSWORD: pride-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio-data:/data]

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 pride pride-secret; do sleep 1; done;
      mc mb --ignore-existing local/pride;
      exit 0;
      "

  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports: ["1025:1025", "8025:8025"]

  web:
    profiles: ["app"]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://pride:pride@db:5432/pride?schema=public
      S3_ENDPOINT: http://minio:9000
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
    depends_on:
      db: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    ports: ["3000:3000"]

volumes:
  db-data:
  minio-data:
