# Production (Dokploy) : docker compose -f docker-compose.prod.yml up -d --build
# Le HTTPS et le nom de domaine sont gérés par Dokploy (onglet Domains : service « web », port 3000).
# Fichiers enregistrés sur le disque (volume « uploads ») : MinIO a retiré ses images de Docker Hub.
name: pride-prod

services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: pride
    volumes: [db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d pride"]
      interval: 10s
      retries: 10

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: always
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/pride?schema=public
      S3_ENDPOINT: ""
      UPLOAD_DIR: /app/uploads
    volumes: [uploads:/app/uploads]
    expose: ["3000"]
    depends_on:
      db: { condition: service_healthy }

volumes:
  db-data:
  uploads:
